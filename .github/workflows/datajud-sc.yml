name: Justiça criminal em SC (DataJud)

on:
  schedule:
    - cron: "40 9 * * 1"   # segundas-feiras, 6h40 em Brasília
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: datajud-sc
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar agregados do TJSC na API Pública do DataJud
        run: python3 scripts/datajud_sc.py
      - name: Gravar dados atualizados
        run: |
          git config user.name "datajud-sc[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/datajud/
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados."
          else
            git commit -m "Justiça criminal em SC: atualização automática dos dados (DataJud)"
            git pull --rebase
            git push
          fi
